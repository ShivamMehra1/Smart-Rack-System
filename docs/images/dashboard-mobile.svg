    <rect x="39" y="454" width="102" height="50" rx="9" fill="#101f29" stroke="#2a3a46"/><text x="52" y="475" class="small blue" font-weight="700">A4</text><text x="52" y="493" class="tiny">Available</text><rect x="155" y="454" width="102" height="50" rx="9" fill="#142c26" stroke="#2b7052"/><text x="168" y="475" class="small green" font-weight="700">B1</text><text x="168" y="493" class="tiny">Occupied</text><rect x="271" y="454" width="102" height="50" rx="9" fill="#101f29" stroke="#2a3a46"/><text x="284" y="475" class="small blue" font-weight="700">B2</text><text x="284" y="493" class="tiny">Available</text></g>
  <rect class="card" x="20" y="545" width="380" height="143" rx="15"/><text x="39" y="578" font-size="16" font-weight="700">Device health</text><circle cx="45" cy="611" r="5" fill="#56d392"/><text x="60" y="616" class="small">PN532 RFID · SPI</text><text x="360" y="616" class="tiny green" text-anchor="end">READY</text><circle cx="45" cy="646" r="5" fill="#56d392"/><text x="60" y="651" class="small">Wi-Fi access point</text><text x="360" y="651" class="tiny muted" text-anchor="end">192.168.4.1</text>
