  <rect class="card" x="219" y="194" width="181" height="100" rx="14"/><text x="236" y="221" class="tiny muted">BAGS STORED</text><text x="236" y="264" font-size="28" font-weight="700">4</text><text x="275" y="262" class="small muted">active</text>
  <rect class="card" x="20" y="310" width="380" height="219" rx="15"/><text x="39" y="345" font-size="16" font-weight="700">Compartment status</text><text x="39" y="367" class="small muted">4 occupied · 8 available</text>
