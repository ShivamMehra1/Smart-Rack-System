<svg xmlns="http://www.w3.org/2000/svg" width="420" height="880" viewBox="0 0 420 880" role="img" aria-labelledby="title desc">
  <title id="title">Rackline mobile dashboard preview</title>
  <desc id="desc">Illustrative mobile view of the smart rack dashboard, with compact status cards, a compartment summary, and bottom navigation.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#09131b"/><stop offset="1" stop-color="#0d1720"/></linearGradient><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8eef7}.muted{fill:#91a0b4}.tiny{font-size:10px}.small{font-size:12px}.body{font-size:13px}.title{font-size:22px;font-weight:700}.card{fill:#111f2a;stroke:#243441;stroke-width:1}.green{fill:#75d5a2}.blue{fill:#76b7ff}</style></defs>
  <rect width="420" height="880" rx="28" fill="url(#bg)"/><rect x="0" y="0" width="420" height="80" rx="28" fill="#0b151d"/><path d="M0 80h420" stroke="#24333e"/>
  <rect x="20" y="20" width="38" height="38" rx="11" fill="#347fe2"/><path d="M30 32h18v15H30zM34 28h10v4H34z" fill="none" stroke="#fff" stroke-width="2"/><text x="69" y="39" font-size="17" font-weight="700">Rackline</text><text x="69" y="55" class="tiny muted">SMART STORAGE</text><circle cx="379" cy="39" r="6" fill="#56d392"/><text x="322" y="60" class="tiny green">ONLINE</text>
  <text x="22" y="119" class="tiny muted">RACKLINE / OVERVIEW</text><text x="22" y="151" class="title">Rack overview</text><text x="22" y="174" class="small muted">Storage and device status at a glance.</text>
